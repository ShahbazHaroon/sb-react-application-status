server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    #--------------------------------------------------
    # GZIP compression
    #--------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
	gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    #--------------------------------------------------
    # Hashed frontend assets: cache for a long time
    #--------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    #--------------------------------------------------
    # React SPA fallback: always serve index.html (never cache it)
    #--------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    #--------------------------------------------------
    # This should only be used when you are working with static website
    #--------------------------------------------------
    #location / {
    #       try_files $uri $uri/ =404;
    #}

    #--------------------------------------------------
    # Security headers
    #--------------------------------------------------
    #add_header X-Frame-Options "DENY" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    #add_header X-XSS-Protection "1; mode=block";
	#add_header Referrer-Policy "no-referrer" always;
	#add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
	#add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}